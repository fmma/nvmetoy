[package]
name = "nvmetoy"
version = "0.1.0"
edition = "2021"

[dependencies]
zerocopy = { version = "0.8", features = ["derive"] }
libc = "0.2"
rustyline = "14"
xnvme-sys = { version = "0.7.5", optional = true }

[features]
xnvme = ["dep:xnvme-sys"]

[[bin]]
name = "xnvmetoy"
required-features = ["xnvme"]
